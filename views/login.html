<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - City Mystery</title>
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="login.html">
      <span class="brand-icon"></span>
      <span class="brand-name">City Mystery</span>
    </a>
  </header>

  <div class="login-shell">
    <div class="login-intro">
      <h1>Explore the UK.</h1>
      <p>Discover cities, plan a day trip and collect digital stamps.</p>
    </div>

    <div class="login-panel" id="login-panel">
      <div class="auth-tabs">
        <button type="button" class="is-selected" id="login-btn">Log in</button>
        <button type="button" id="signup-btn">Sign up</button>
      </div>
      <div id="login-form">
        <form >
            <label for="username">Username</label>
            <input id="username" name="username" required pattern="[A-Za-z0-9]+" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" title="Use letters and numbers only">

            <label for="password">Password</label>
            <div class="password-field">
                <input id="password" name="password" type="password" required pattern="[A-Za-z0-9]+" maxlength="128" autocomplete="current-password" title="Use letters and numbers only">
                <button id="toggle-password" type="button">Show</button>
            </div>

            <p class="field-note">Letters and numbers only. Both fields are required.</p>
            <button id="login-submit" type="submit" class="submit-button">Log in</button>
        </form>
      </div>

      <div id="signup-form" hidden>
        <form id="signup-form-inner">
        <label for="username">Username</label>
        <input id="susername" name="username" required pattern="[A-Za-z0-9]+" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" title="Use letters and numbers only">

        <label for="password">Password</label>
        <div class="password-field">
          <input id="spassword" name="password" type="password" maxlength="128">
          <button id="stoggle-password" type="button">Show</button>
        </div>

        <label for="confirm">Confirm password</label>
        <input id="spassword-confirm" name="password-confirm" type="password" maxlength="128" autocapitalize="none" spellcheck="false">

        <p id="notifier"></p>
        <p class="field-note">Password must be longer than 8, containing letters and numbers.</p>
        <button id="signup-submit" type="submit" class="submit-button">Sign up</button>
        </form>
      </div>
    </div>
  </div>
</body>
<script>
  if (new URLSearchParams(location.search).get('expired')) {
    window.alert('Session expired after 24 hours, please login again.');
  }

  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  const loginBtn = document.getElementById("login-btn");
  const signupBtn = document.getElementById("signup-btn");
  const loginSubmitBtn = document.getElementById("login-submit");
  const signupSubmitBtn = document.getElementById("signup-submit");
  loginBtn.addEventListener("click", () => {
    loginBtn.classList.toggle("is-selected", true);
    signupBtn.classList.toggle("is-selected", false);
    loginForm.hidden = false;
    signupForm.hidden = true;
  });
  signupBtn.addEventListener("click", () => {
    loginBtn.classList.toggle("is-selected", false);
    signupBtn.classList.toggle("is-selected", true);
    loginForm.hidden = true;
    signupForm.hidden = false;
  });
  const usernameInput = document.getElementById("username");
  const signupUsernameInput = document.getElementById("susername");
  const pwdInput = document.getElementById("password");
  const signupPwdInput = document.getElementById("spassword");
  const signupPwdInputC = document.getElementById("spassword-confirm");
  const notifier = document.getElementById("notifier");
  loginSubmitBtn.addEventListener('click', async () => {
    const loginInfo = { username: usernameInput.value, password: pwdInput.value };
    const _ = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(loginInfo),
    }).then(async res => {
      const response = await res.json();
      if (response.is_success) {
        window.location.replace(`/home`);
      } else {
        window.alert(response.message);
      }
    });
  });
  document.getElementById("signup-form-inner").addEventListener('submit', async (e) => {
    e.preventDefault();
    const susername = signupUsernameInput.value;
    const spwd = signupPwdInput.value;
    const spwdc = signupPwdInputC.value;
    const re = /^(?=.*\d)(?=.*[A-Za-z]).+$/;
    if (spwd.length < 8 || !re.test(spwd)) {
      notifier.textContent = 'This password is too weak!';
      return;
    }
    if (spwd != spwdc) {
      notifier.textContent = 'Password does not match!';
      return;
    }
    const signupInfo = { username: susername, password: spwd };
    const signup = await fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(signupInfo),
    }).then(async res => {
      const response = await res.json();
      if (!response.is_success) {
        window.alert(response.message);
      }
    });
    const login = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(signupInfo), // use signup info to login immediately
    }).then(async res => {
      const response = await res.json();
      if (response.is_success) {
        window.location.replace(`/home`);
      } else {
        window.alert(response.message);
      }
    });
  });
</script>
</html>
